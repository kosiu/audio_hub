pcm.all_channels {
    type route
    slave.pcm "hw:ICUSBAUDIO7D"
    slave.channels 6

    # --- LEFT INPUT (Radio Left) ---
    ttable.0.0 1.0   # Route to physical Front Left
    ttable.0.4 1.0   # Route to physical Rear Left 
    
    # Send 50% Left to the physical Subwoofer (which your test showed is on ALSA ch 2)
    ttable.0.2 0.5   
    
    # Send 50% Left to the physical Center (which your test showed is on ALSA ch 3)
    ttable.0.3 0.5   

    # --- RIGHT INPUT (Radio Right) ---
    ttable.1.1 1.0   # Route to physical Front Right
    ttable.1.5 1.0   # Route to physical Rear Right
    
    # Send 50% Right to the physical Subwoofer (ALSA ch 2)
    ttable.1.2 0.5   
    
    # Send 50% Right to the physical Center (ALSA ch 3)
    ttable.1.3 0.5   
}

pcm.!default {
    type plug
    slave.pcm "all_channels"
}

