pcm.stereo_in {
    type plug
    slave {
        pcm "front:CARD=Stereo,DEV=0"
        channels 2
        rate 48000
        format S16_LE
    }
}

pcm.surround_in {
    type plug
    slave {
        pcm "surround51:CARD=Surround,DEV=0"
        channels 6
        rate 48000
        format S16_LE
    }
}

pcm.Stereo {
    type plug
    slave.pcm "stereo_in"
}

pcm.Surround {
    type plug
    slave.pcm "surround_in"
}

pcm.!default {
    type plug
    slave.pcm "stereo_in"
}

pcm.full_8ch {
    type multi
    
    # Input A: The 6 channels from optical capture side
    slaves.a.pcm "hw:CARD=Surround,DEV=1"
    slaves.a.channels 6
    
    # Input B: The 2 channels from stereo capture side
    slaves.b.pcm "hw:CARD=Stereo,DEV=1"
    slaves.b.channels 2
    
    # The Glue: Map them into an 8-channel stream for CamillaDSP
    bindings {
        0 { slave a; channel 0 } # Ch 0: Front L
        1 { slave a; channel 1 } # Ch 1: Front R
        2 { slave a; channel 2 } # Ch 2: Center
        3 { slave a; channel 3 } # Ch 3: Sub
        4 { slave a; channel 4 } # Ch 4: Rear L
        5 { slave a; channel 5 } # Ch 5: Rear R
        6 { slave b; channel 0 } # Ch 6: Stereo L
        7 { slave b; channel 1 } # Ch 7: Stereo R
    }
}
