---
title: "Audio Hub solo: front left"
description: "Route normal loopback audio only to the physical front left speaker"

devices:
  samplerate: 48000
  chunksize: 1024
  capture:
    type: Alsa
    channels: 2
    device: "hw:Loopback,0,0"
    format: S16_LE
    labels:
      - "input_left"
      - "input_right"
  playback:
    type: Alsa
    channels: 6
    device: "hw:ICUSBAUDIO7D"
    format: S16_LE

mixers:
  solo_to_6:
    description: "Route loopback audio to one physical speaker only"
    channels:
      in: 2
      out: 6
    labels:
      - "front_left"
      - "front_right"
      - "subwoofer_physical_via_fc"
      - "center_physical_via_lfe"
      - "rear_left"
      - "rear_right"
    mapping:
      - dest: 0
        sources:
          - channel: 0
            gain: -6.0
            inverted: false
          - channel: 1
            gain: -6.0
            inverted: false
      - dest: 1
        sources:
          - channel: 0
            gain: -120.0
            inverted: false
      - dest: 2
        sources:
          - channel: 0
            gain: -120.0
            inverted: false
      - dest: 3
        sources:
          - channel: 0
            gain: -120.0
            inverted: false
      - dest: 4
        sources:
          - channel: 0
            gain: -120.0
            inverted: false
      - dest: 5
        sources:
          - channel: 0
            gain: -120.0
            inverted: false

filters:
  subwoofer_lowpass_120hz:
    type: Biquad
    parameters:
      type: Lowpass
      freq: 120
      q: 0.707
  speakers_highpass_120hz:
    type: Biquad
    parameters:
      type: Highpass
      freq: 120
      q: 0.707

pipeline:
  - type: Mixer
    name: solo_to_6
  - type: Filter
    channels: [2]
    names:
      - subwoofer_lowpass_120hz
  - type: Filter
    channels: [0, 1, 3, 4, 5]
    names:
      - speakers_highpass_120hz