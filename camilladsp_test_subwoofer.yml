---
title: "Audio Hub test: subwoofer"
description: "Speaker identification profile for the current physical subwoofer output"

devices:
  samplerate: 48000
  chunksize: 1024
  capture:
    type: SignalGenerator
    channels: 1
    signal:
      type: Sine
      freq: 50
      level: -20.0
    labels:
      - "test_tone"
  playback:
    type: Alsa
    channels: 6
    device: "hw:ICUSBAUDIO7D"
    format: S16_LE

mixers:
  test_to_6:
    description: "Route the test tone to one physical speaker"
    channels:
      in: 1
      out: 6
    labels:
      - "front_left"
      - "front_right"
      - "subwoofer_physical_via_fc"
      - "center_physical_via_lfe"
      - "rear_left"
      - "rear_right"
    mapping:
      - dest: 0
        sources:
          - channel: 0
            gain: -120.0
            inverted: false
      - dest: 1
        sources:
          - channel: 0
            gain: -120.0
            inverted: false
      - dest: 2
        sources:
          - channel: 0
            gain: 0.0
            inverted: false
      - dest: 3
        sources:
          - channel: 0
            gain: -120.0
            inverted: false
      - dest: 4
        sources:
          - channel: 0
            gain: -120.0
            inverted: false
      - dest: 5
        sources:
          - channel: 0
            gain: -120.0
            inverted: false

filters:
  subwoofer_lowpass_120hz:
    type: Biquad
    parameters:
      type: Lowpass
      freq: 120
      q: 0.707
  speakers_highpass_120hz:
    type: Biquad
    parameters:
      type: Highpass
      freq: 120
      q: 0.707

pipeline:
  - type: Mixer
    name: test_to_6
  - type: Filter
    channels: [2]
    names:
      - subwoofer_lowpass_120hz
  - type: Filter
    channels: [0, 1, 3, 4, 5]
    names:
      - speakers_highpass_120hz