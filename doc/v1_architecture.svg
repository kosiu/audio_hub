<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #0f172a; stroke-width: 2; rx: 14; ry: 14; }
      .hw { fill: #e0f2fe; }
      .sw { fill: #ecfccb; }
      .ext { fill: #fef3c7; }
      .title { font: 700 26px sans-serif; fill: #0f172a; }
      .label { font: 600 18px sans-serif; fill: #0f172a; }
      .small { font: 15px sans-serif; fill: #334155; }
      .line { stroke: #0f172a; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 8 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="760"/>
  <text class="title" x="40" y="50">Audio Hub 1.0 Architecture</text>

  <rect class="box ext" x="40" y="120" width="180" height="90"/>
  <text class="label" x="110" y="160">IR Remote</text>
  <text class="small" x="65" y="188">evdev key events</text>

  <rect class="box ext" x="40" y="300" width="180" height="90"/>
  <text class="label" x="66" y="340">Web Clients</text>
  <text class="small" x="70" y="368">HTTP REST + SSE</text>

  <rect class="box ext" x="40" y="480" width="180" height="90"/>
  <text class="label" x="62" y="520">Bluetooth</text>
  <text class="small" x="65" y="548">phones, tablets</text>

  <rect class="box sw" x="350" y="100" width="280" height="500"/>
  <text class="label" x="405" y="140">OrangePi / audio_hub</text>

  <rect class="box" x="390" y="170" width="200" height="80"/>
  <text class="label" x="432" y="215">audio_hub.py</text>

  <rect class="box" x="390" y="280" width="200" height="80"/>
  <text class="label" x="422" y="325">devices.py</text>

  <rect class="box" x="390" y="390" width="200" height="80"/>
  <text class="label" x="404" y="435">http_server.py</text>

  <rect class="box" x="390" y="500" width="200" height="80"/>
  <text class="label" x="405" y="545">dbus_bluez.py</text>

  <rect class="box hw" x="840" y="220" width="220" height="150"/>
  <text class="label" x="910" y="260">DAC</text>
  <text class="small" x="868" y="292">input select button</text>
  <text class="small" x="868" y="320">surround/stereo button</text>
  <text class="small" x="868" y="348">front-panel input LEDs</text>

  <rect class="box hw" x="1110" y="250" width="120" height="90"/>
  <text class="label" x="1127" y="300">5.1 Amp</text>

  <rect class="box ext" x="1120" y="420" width="110" height="80"/>
  <text class="label" x="1137" y="468">Speakers</text>

  <rect class="box ext" x="800" y="470" width="120" height="70"/>
  <text class="label" x="835" y="513">PC</text>
  <text class="small" x="812" y="535">optical</text>

  <rect class="box ext" x="950" y="470" width="120" height="70"/>
  <text class="label" x="987" y="513">TV</text>
  <text class="small" x="962" y="535">optical</text>

  <rect class="box ext" x="875" y="590" width="160" height="80"/>
  <text class="label" x="899" y="635">Silent Input</text>
  <text class="small" x="917" y="657">used as off</text>

  <path class="line" d="M220 165 L390 210"/>
  <text class="small" x="240" y="170">remote control</text>

  <path class="line" d="M220 345 L390 430"/>
  <text class="small" x="240" y="332">browser API</text>

  <path class="line" d="M220 525 L390 540"/>
  <text class="small" x="225" y="500">pairing + audio sink</text>

  <path class="line" d="M590 320 L840 280"/>
  <text class="small" x="665" y="280">GPIO pulse: input select</text>

  <path class="line" d="M590 340 L840 315"/>
  <text class="small" x="668" y="338">GPIO pulse: surround toggle</text>

  <path class="line dash" d="M840 350 L590 360"/>
  <text class="small" x="675" y="382">GPIO sense: DAC LEDs</text>

  <path class="line" d="M590 210 L840 245"/>
  <text class="small" x="700" y="220">analog/local audio out</text>

  <path class="line" d="M860 470 L895 372"/>
  <path class="line" d="M1010 470 L975 372"/>
  <path class="line" d="M955 590 L955 372"/>

  <text class="small" x="940" y="445">digital inputs</text>

  <path class="line" d="M1060 295 L1110 295"/>
  <path class="line" d="M1175 340 L1175 420"/>

  <text class="small" x="1110" y="230">audio out</text>
</svg>